name: Publish Node Guard alpha

on:
  push:
    tags:
      - 'v*-alpha.*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Reviewed alpha tag to stage (for example v0.2.0-alpha.8)'
        required: true
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: npm-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    if: github.repository == 'Smccann01/node-guard-free'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref }}
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          package-manager-cache: false
      - run: npm install --global npm@11.21.1
      - name: Verify release tag and npm version
        env:
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}
        run: |
          node -e "const p=require('./package.json'); if (process.env.RELEASE_TAG !== 'v'+p.version || !/^0\\.2\\.0-alpha\\.[0-9]+$/.test(p.version)) process.exit(1)"
          test "$(git rev-parse HEAD)" = "$(git rev-list -n 1 "$RELEASE_TAG")"
          git fetch --no-tags origin main
          git merge-base --is-ancestor HEAD origin/main
          npm --version
          test "$(npm config get registry)" = 'https://registry.npmjs.org/'
          if [ -n "${NODE_AUTH_TOKEN:-}" ]; then
            echo 'A static npm token is present; this release must use OIDC only.' >&2
            exit 1
          fi
      - run: npm ci
      - run: npm test
      - run: npm run typecheck
      - run: npm run smoke:package
      - run: npm run smoke:next
      - name: Stage with npm trusted publisher
        run: npm stage publish --tag alpha --access public
